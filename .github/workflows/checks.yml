name: Source and release checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/check_repository.py
      - run: python -m unittest discover -s tools -p test_release_payload.py
      - run: python tools/release_payload.py --prepare-input .inputs/max04-baseline
      - run: python tools/release_payload.py --baseline .inputs/max04-baseline --out build/max04-reproduced
      - run: python tools/check_max10_release.py
      - run: python tools/release_max10_payload.py --prepare-input .inputs/max10-baseline
      - run: python tools/release_max10_payload.py --baseline .inputs/max10-baseline --out build/max10-reproduced
      - run: python tools/check_max15_release.py
      - run: python tools/release_max15_payload.py --prepare-input .inputs/max15-baseline
      - run: python tools/release_max15_payload.py --baseline .inputs/max15-baseline --out build/max15-reproduced
      - run: python tools/check_max18_release.py
      - run: python tools/check_max30_release.py
      - run: python tools/check_max31_release.py
      - run: python tools/check_max32_release.py
      - run: python tools/check_max33_release.py
      - run: python tools/check_max34_release.py
      - run: python tools/check_vehicle_config.py
      - run: python -m unittest discover -s tools -p test_vehicle_config.py
  max18-reproduction:
    # Match the tested ZIP's deflater; Linux zlib packs different archive bytes.
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.2'
      - run: python tools/release_max18_payload.py --prepare-input .inputs/max18-baseline
      - run: python tools/release_max18_payload.py --prepare-nav .inputs/max18-navigation.zip
      - run: python tools/release_max18_payload.py --baseline .inputs/max18-baseline --navigation .inputs/max18-navigation.zip --out build/max18-reproduced
  iphone-cover:
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            python: '3.12'
          - os: windows-latest
            python: '3.14.2'
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - run: python -m pip install -r tools/requirements-cover.txt
      - run: python -m unittest discover -s tools -p test_cover_package.py
      - run: python tools/verify_cover_patches.py --prepare-input .inputs/cover/MAX31.lgu
      - run: python tools/patch_cover_final_packet.py .inputs/cover/MAX31.lgu build/cover/candidate.lgu --version 7.0.6.COVERTEST
      - run: python tools/verify_cover_patches.py .inputs/cover/MAX31.lgu build/cover/candidate.lgu --version 7.0.6.COVERTEST --report build/cover/verification.json
      - run: python tools/prepare_usb_transition34.py --lgu .inputs/usb/MAX33.lgu --output .inputs/usb/MgrUSB-MAX33.exe
      - run: python tools/verify_usb_transition34.py --baseline .inputs/usb/MgrUSB-MAX33.exe --out .inputs/usb/verification.json
      - run: python tools/prepare_vehicle_config_input.py --lgu .inputs/usb/MAX33.lgu --output .inputs/vehicle/MicomManager.exe
      - run: python tools/verify_vehicle_config_paths.py --module .inputs/vehicle/MicomManager.exe --output .inputs/vehicle/native-paths.json
