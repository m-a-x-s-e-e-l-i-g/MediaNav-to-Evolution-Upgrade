name: Source and release checks
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python tools/check_repository.py
      - run: python -m unittest discover -s tools -p test_release_payload.py
      - run: python tools/release_payload.py --prepare-input .inputs/max04-baseline
      - run: python tools/release_payload.py --baseline .inputs/max04-baseline --out build/max04-reproduced
      - run: python -m pip install -r tools/requirements.txt
      - run: python -m unittest discover -s tools -p test_usb_graph_state.py
      - run: python tools/build_usb_graph_state_development.py --baseline build/max04-reproduced/payload --out build/usb-graph-state-development
      - run: python -m unittest discover -s tools -p test_usb_graph_init.py
      - run: python tools/build_usb_graph_init_development.py --baseline build/max04-reproduced/payload --out build/usb-graph-init-development
      - run: python -m unittest discover -s tools -p test_usb_seek_timing.py
      - run: python tools/build_usb_seek_timing_development.py --baseline build/max04-reproduced/payload --out build/usb-seek-timing-development
      - run: python -m unittest discover -s tools -p test_usb_seek_completion.py
      - run: python tools/build_usb_seek_completion_development.py --baseline build/max04-reproduced/payload --out build/usb-seek-completion-development
      - run: python -m unittest discover -s tools -p test_usb_playback_start.py
      - run: python tools/build_usb_playback_start_development.py --baseline build/max04-reproduced/payload --out build/usb-playback-start-development
      - run: python -m unittest discover -s tools -p test_usb_playback_recovery.py
      - run: python tools/build_usb_playback_recovery_development.py --baseline build/max04-reproduced/payload --out build/usb-playback-recovery-development
      - run: python -m unittest discover -s tools -p test_usb_duration_output.py
      - run: python tools/build_usb_duration_output_development.py --baseline build/max04-reproduced/payload --out build/usb-duration-output-development
      - run: python -m unittest discover -s tools -p test_usb_completion_event.py
      - run: python tools/build_usb_completion_event_development.py --baseline build/max04-reproduced/payload --out build/usb-completion-event-development
      - run: python -m unittest discover -s tools -p test_artwork_draw_failure.py
      - run: python tools/build_artwork_draw_failure_development.py --baseline build/max04-reproduced/payload --out build/artwork-draw-failure-development
      - run: python -m unittest discover -s tools -p test_artwork_gdi_guards.py
      - run: python tools/build_artwork_gdi_guards_development.py --baseline build/max04-reproduced/payload --out build/artwork-gdi-guards-development
      - run: python -m unittest discover -s tools -p test_artwork_stack_frame.py
      - run: python tools/build_artwork_stack_frame_development.py --baseline build/max04-reproduced/payload --out build/artwork-stack-frame-development
      - run: python -m unittest discover -s tools -p test_usb_metadata_copies.py
      - run: python tools/build_usb_metadata_copies_development.py --baseline build/max04-reproduced/payload --out build/usb-metadata-copies-development
      - run: python -m unittest discover -s tools -p test_usb_catalog_initialization.py
      - run: python tools/build_usb_catalog_initialization_development.py --baseline build/max04-reproduced/payload --out build/usb-catalog-initialization-development
      - run: python tools/verify_usb_catalog_readiness.py --candidate "build/usb-catalog-initialization-development/payload/upgrade/Storage Card/System/MgrUSB.exe" --report build/usb-catalog-readiness.json
      - run: python -m unittest discover -s tools -p test_usb_catalog_recovery.py
      - run: python tools/build_usb_catalog_recovery_development.py --baseline build/max04-reproduced/payload --out build/usb-catalog-recovery-development
      - run: python tools/verify_usb_catalog_recovery_allocator.py --candidate "build/usb-catalog-recovery-development/payload/upgrade/Storage Card/System/MgrUSB.exe" --report build/usb-catalog-recovery-allocator.json
      - run: python tools/verify_usb_scan_coordination.py --candidate "build/usb-catalog-recovery-development/payload/upgrade/Storage Card/System/MgrUSB.exe" --baseline "build/max04-reproduced/payload/upgrade/Storage Card/System/MgrUSB.exe" --report build/usb-scan-coordination.json
      - run: python tools/verify_usb_shuffle_lifecycle.py --candidate "build/usb-catalog-recovery-development/payload/upgrade/Storage Card/System/MgrUSB.exe" --baseline "build/max04-reproduced/payload/upgrade/Storage Card/System/MgrUSB.exe" --report build/usb-shuffle-lifecycle.json
      - run: python tools/verify_usb_lifecycle_protocol.py --input "build/usb-catalog-recovery-development/payload/upgrade/Storage Card/System/MgrUSB.exe" --report build/usb-lifecycle-protocol.json
